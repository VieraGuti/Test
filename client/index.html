<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080a0d">
  <title>VieraStrike — FPS Arena Control Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; touch-action: none; overscroll-behavior: none; }
    canvas { display: block; }
    #menu-overlay { position: fixed; inset: 0; background: linear-gradient(135deg,#080b10,#17131d 55%,#091316); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:200; color:white; padding: max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left)); }
    #menu-overlay h1 { font-size: clamp(38px,10vw,64px); color:#ff684e; text-shadow:0 0 28px rgba(255,104,78,.25); margin-bottom:8px; letter-spacing:.08em; }
    #menu-overlay .subtitle { font-size:13px; color:#a4abb6; margin-bottom:34px; letter-spacing:.18em; text-align:center; }
    #find-match-btn,#solo-btn { width:min(82vw,340px); padding:16px 28px; font-size:17px; font-weight:800; color:white; border-radius:10px; cursor:pointer; letter-spacing:.08em; text-transform:uppercase; }
    #find-match-btn { background:#a82020; border:1px solid #ff5a5a; }
    #solo-btn { margin-top:12px; background:#174d38; border:1px solid #43ae77; }
    #find-match-btn:disabled,#solo-btn:disabled { opacity:.45; }
    .controls-hint { margin-top:26px; color:#737c89; font-size:12px; text-align:center; line-height:1.8; }
    .controls-hint span { color:#c6ccd5; background:rgba(255,255,255,.08); padding:2px 7px; border-radius:4px; }
    .credit { position:absolute; bottom:max(10px,env(safe-area-inset-bottom)); font-size:10px; color:#555f6a; text-align:center; padding:0 20px; }
    #status-overlay { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:150; pointer-events:none; }
    #status-overlay.active { display:flex; }
    #status-overlay.has-pointer { pointer-events:all; background:rgba(0,0,0,.7); }
    #status-text { font-size:clamp(30px,8vw,48px); color:white; text-shadow:0 0 20px rgba(255,255,255,.3); font-weight:800; letter-spacing:.05em; text-align:center; }
    #status-sub { font-size:15px; color:#aaa; margin-top:12px; text-align:center; padding:0 24px; }
    #rematch-btn { margin-top:26px; padding:14px 38px; font-size:17px; font-weight:800; color:white; background:#2459ac; border:1px solid #5c91eb; border-radius:8px; display:none; }
    @media (orientation: portrait) and (max-width:900px){ #menu-overlay::before{content:'Gira el iPhone en horizontal para probar los controles';position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;text-align:center;color:#ffcb73;font-size:12px;} }
  </style>
</head>
<body>
  <div id="menu-overlay">
    <h1>VIERASTRIKE</h1>
    <div class="subtitle">CONTROL TEST · FPS ARENA BASE</div>
    <button id="find-match-btn">FIND MATCH</button>
    <button id="solo-btn">SOLO CONTROL TEST</button>
    <div class="controls-hint"><span>Left stick</span> Move &nbsp; <span>Right side</span> Look &nbsp; <span>FIRE</span> Shoot</div>
    <div class="credit">Technical test based on Colin McDonough's FPS Arena · CC BY-NC 4.0 · modified for VieraStrike testing</div>
  </div>
  <div id="status-overlay"><div id="status-text"></div><div id="status-sub"></div><button id="rematch-btn">REMATCH</button></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
