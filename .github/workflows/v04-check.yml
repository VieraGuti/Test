name: VAST v0.5 integrity

on:
  push:
    branches: [vast-zombie-revival]
    paths:
      - 'public/v04/**'
      - 'public/v05/**'
      - 'public/v04.css'
      - 'public/v05.css'
      - 'public/game-v05-loader.js'
      - 'public/index.html'
      - '.github/workflows/v04-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild browser module
        run: |
          cat public/v04/part-*.txt > /tmp/game-v04.js
          cat public/v05/patch-*.txt > /tmp/v05-patch.js
          cat /tmp/game-v04.js /tmp/v05-patch.js > /tmp/game-v05.js
      - name: Check JavaScript syntax
        run: |
          node --check /tmp/game-v04.js
          node --check /tmp/v05-patch.js
          node --check /tmp/game-v05.js
          node --check public/game-v05-loader.js
      - name: Check required systems
        run: |
          grep -q "function updateZombies" /tmp/game-v05.js
          grep -q "function triggerHeliEvent" /tmp/game-v05.js
          grep -q "v05CreateFlyHeli" /tmp/game-v05.js
          grep -q "v05StructureGroup" /tmp/game-v05.js
          grep -q "v05BuildReason" /tmp/game-v05.js
          grep -q "v05BuildWeaponBase" /tmp/game-v05.js
          grep -q "game-v05-loader.js" public/index.html
