<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111820"><title>VieraStrike — Dust Mobile Test</title><link rel="stylesheet" href="/style.css"></head><body><div id="game"></div><div id="login" class="overlay"><div class="panel"><div class="eyebrow">MOBILE TACTICAL FPS · DUST TEST</div><h1>VIERA<span>STRIKE</span></h1><p>5v5 Bomb Defusal · mapa desértico A/B · primera persona</p><input id="name" maxlength="16" placeholder="Tu nombre" value="Wery"><button id="play">ENTRAR AL MAPA</button><small>Puedes probarlo tú solo. Al terminar la compra, muévete hacia A o B y mantén USE para plantar.</small><div id="login-status"></div></div></div><div id="hud" class="hidden"><div id="topbar"><div class="team attackers"><b>ATK</b><span id="atk-score">0</span></div><div id="roundbox"><span id="round">R1</span><strong id="timer">--:--</strong><em id="phase">WAITING</em></div><div class="team defenders"><span id="def-score">0</span><b>DEF</b></div></div><div id="status-left" class="hud-card"><div><span class="label">HP</span><b id="hp">100</b></div><div><span class="label">ARMOR</span><b id="armor">0</b></div><div><span class="label">$</span><b id="money">800</b></div></div><div id="weapon-card" class="hud-card"><span id="weapon-name">PX-9</span><strong><b id="ammo">15</b><small>/ <span id="reserve">60</span></small></strong><em id="reload-state"></em></div><div id="bomb-card" class="hidden"></div><div id="action-progress" class="hidden"><div></div><span></span></div><div id="crosshair"><i></i><i></i><i></i><i></i></div><div id="feed"></div></div><div id="buy-menu" class="overlay hidden"><div class="panel"><div class="buy-head"><h2>ARSENAL</h2><button id="close-buy">×</button></div><div id="buy-grid"></div></div></div><div id="scoreboard" class="overlay hidden"><div class="panel"><h2>MARCADOR</h2><div id="score-rows"></div></div></div><div id="mobile" class="hidden"><div id="move-zone"><div id="move-base"><div id="move-knob"></div></div></div><div id="look-zone"></div><button id="m-fire" class="round-btn fire">FIRE</button><button id="m-reload" class="round-btn">R</button><button id="m-use" class="round-btn">USE</button><button id="m-buy" class="round-btn">BUY</button></div><script type="module" src="/main.js"></script></body></html>
